```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Approval Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Loan Approval Prediction</h1>

    <p>Enter applicant details</p>

    <form action="/predict" method="POST">

        <label>Number of Dependents</label>
        <input type="number" name="dependents" required>


        <label>Education</label>
        <select name="education" required>
            <option value="">Select</option>
            <option value="Graduate">Graduate</option>
            <option value="Not Graduate">Not Graduate</option>
        </select>


        <label>Self Employed</label>
        <select name="self_employed" required>
            <option value="">Select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>


        <label>Annual Income</label>
        <input type="number" name="income" required>


        <label>Loan Amount</label>
        <input type="number" name="loan_amount" required>


        <label>Loan Term (Years)</label>
        <input type="number" name="loan_term" required>


        <label>CIBIL Score</label>
        <input type="number" name="cibil_score" required>


        <label>Residential Assets Value</label>
        <input type="number" name="residential_assets" required>


        <label>Commercial Assets Value</label>
        <input type="number" name="commercial_assets" required>


        <label>Luxury Assets Value</label>
        <input type="number" name="luxury_assets" required>


        <label>Bank Asset Value</label>
        <input type="number" name="bank_assets" required>


        <button type="submit">Predict Loan</button>

    </form>


    {% if prediction %}
    <div class="result">
        {{ prediction }}
    </div>
    {% endif %}

</div>

</body>
</html>
```
